# How the DexHand V1 forearm attaches to each arm, and what happens downstream.
#
# The wrist is no longer guesswork. `generate_urdf.py` reads the real joint
# origins, axes and travel limits straight out of the V1 description in
# vendor/dexhand_v1_description, so the chain below is whatever upstream says:
#
#   forearm  --wrist_pitch_lower-->  wrist_lower
#            --wrist_yaw---------->  wrist_upper
#            --wrist_pitch_upper-->  hand
#
# Right side, for reference (metres, radians; the left side differs slightly and
# is read from its own file rather than mirrored):
#
#   wrist_pitch_lower  xyz (-0.012,   -0.0217, 0.203)     axis (0, -1, 0)  +/- 30.0 deg
#   wrist_yaw          xyz (-0.01198,  0.021,  0.029)     axis (-1, 0, 0)  +/- 25.0 deg
#   wrist_pitch_upper  xyz ( 0.012,    0.021,  0.023266)  axis (0, -1, 0)  +/- 20.0 deg
#
# Three parts, three joints: Forearm, Wrist_joint (lower + upper halves), Hand.
# There is no axial rotation joint -- the V1 README lists that servo as optional
# and the upstream URDF does not model it.

# The legs are not part of this build: nothing plans them, no motor drives them,
# and they only ever contributed collision geometry and mass. Set true to put
# them back -- the whole chain (URDF, collision matrix, SRDF) regenerates from
# this one flag.
#
# With legs off the torso simply floats: `world` welds to `base` at the origin
# and the base mesh sits ~0.675 m up, exactly where it was before. Nothing moves,
# the legs just stop being drawn.
include_legs: false

# ============================ HEAD (ZED 2i) ================================
# The head is the lab's own part (cad/head_zed2i_mount_source.blend): a printed
# bracket that bolts to the torso's top front 2020 rail and holds a pan servo,
# a 3 mm lid over the servo, and a ZED 2i screwed onto the servo horn through
# its 1/4" thread.  Meshes are exported from that file into meshes_head/ (mm):
# bracket, lid and servo in the head_mount frame, and a plain 175.25 x 30.25 x
# 43.10 mm envelope for the camera, centred on zed_camera_center.
#
# head_mount frame = the bracket's datum: the back face of its wings, the
# centre of the 4 x M4 counterbored holes, the slot centre.  Placement as built
# (2026-10-15): wings on the INNER face of the FRONT top rail, bracket centred
# left-right.  Measured from the torso mesh, that face is x = 50 mm and the
# rail spans z 810-830 mm, slot centre 820; the wings are exactly 20 mm tall,
# so they sit flush with the rail.  The bracket faces into the frame, hence
# yaw pi.  T-nuts slide, so y is free: a sideways shift goes in mount.xyz y.
#
# The pan axis is the servo's output axis, through the centre of the top
# horn.  The horn sits at one end of the servo body, so with the bracket
# centred the axis is 9.8 mm right of the centreline (base y = -9.8 mm).
# yaw.origin rpy turns head_pan back to the base orientation, so q = 0 looks
# straight ahead (+x) and positive q turns the head to the robot's left.
#
# Camera frames follow Stereolabs' zed_macro.urdf.xacro for zed2i, so TF from
# the ZED wrapper lines up: zed_camera_link is the 1/4" mount point (here the
# horn top), zed_camera_center is 15 mm above it, the left/right camera frames
# are 10 mm behind the centre at +/-60 mm, each with an optical frame.
#
# NOT MEASURED -- replace when known:
#   - servo model and mass: 60 g placeholder spread over its body envelope
#   - yaw limits, effort and velocity: placeholders for a standard servo
#   - zed_imu_link: put at zed_camera_center with camera axes.  The real IMU
#     offset and rotation are per-unit calibration (ZED SDK
#     camera_imu_transform); zed_imu_ros2 publishes raw sensor axes.
#   - bracket and lid mass: solid PLA (1240 kg/m3); a print weighs less.
head:
  enabled: true
  parent: base
  mount:
    xyz: [0.050, 0.0, 0.820]
    rpy: [0.0, 0.0, 3.141592653589793]
  # Every mesh below is authored in mm in the head_mount frame and is used for
  # both visual and collision.  The inertial is the three parts combined:
  # bracket 83.8 g + lid 6.7 g (solid PLA) + servo 60 g (placeholder).
  parts:
    - mesh: package://berkeley_humanoid_lite_description/meshes_head/head_bracket.stl
      rgba: [0.35, 0.35, 0.38, 1.0]
    - mesh: package://berkeley_humanoid_lite_description/meshes_head/head_plate.stl
      rgba: [0.35, 0.35, 0.38, 1.0]
    - mesh: package://berkeley_humanoid_lite_description/meshes_head/head_servo.stl
      rgba: [0.10, 0.10, 0.10, 1.0]
  scale: 0.001
  mass: 0.15045
  com: [0.020672, -0.000452, 0.001952]          # [m], head_mount frame
  inertia: [8.12194e-05, 4.69098e-05, 8.11333e-05, 9.40267e-08, 1.46784e-07, 8.95427e-08]
  # [ixx, iyy, izz, ixy, ixz, iyz] kg m2, about the com, head_mount axes
  yaw:
    joint: head_yaw
    origin:                                      # horn top centre, head_mount frame
      xyz: [0.0247793, 0.0098105, 0.0289726]
      rpy: [0.0, 0.0, 3.141592653589793]
    axis: [0.0, 0.0, 1.0]
    limits: [-1.5708, 1.5708]                    # [rad]
    effort: 1.5                                  # [N m]
    velocity: 5.0                                # [rad/s]
  camera:
    prefix: zed                                  # zed_camera_link, zed_left_camera_frame, ...
    mount:                                       # zed_camera_link on head_pan
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    height: 0.03                                 # camera_link -> camera_center (zed2i)
    baseline: 0.12
    optical_offset_x: -0.01
    mesh: package://berkeley_humanoid_lite_description/meshes_head/zed2i_body.stl
    rgba: [0.12, 0.12, 0.12, 1.0]
    mass: 0.166                                  # ZED 2i datasheet
    inertia: [0.000437515, 3.83553e-05, 0.000450554, 0.0, 0.0, 0.0]
    # uniform box over the envelope, about zed_camera_center

# ===================== COUPLING V2 (lab part, "2ea") ======================
# The printed part between the elbow_roll flange and the V1 forearm is now the
# lab's own SolidWorks part: cad/coupling_v2_2ea_original.STL as received,
# and meshes_adapter/bhl_v1_forearm_coupling_v2.stl, the same mesh moved into
# the elbow_roll frame by (-36, -36, 0) mm.  It replaces the 24 mm collar
# adapter (meshes_adapter/bhl_v1_forearm_adapter.stl, kept but unused).
#
# The part, measured from its mesh (2026-10-15):
#   D72.0 x 8.5 mm disc on a D43.0 x 1.85 mm spigot, 10.35 mm overall
#   6 x D3.4 through + D6.0 x 5 mm counterbore from the forearm side, on the
#     stock D36 bolt circle at 30 + 60k deg -- the stock hand's pattern
#   2 x D2.5 radial pilots (M3), 5 mm deep, at +/-90 deg (+/-Y), 6.35 mm
#     above the spigot face
#
# How it seats, measured from the repo's meshes:
#   elbow side    the spigot face sits on the actuator output ring (D28-D45,
#                 2.0 mm proud of the housing) where the stock hand's D43 boss
#                 sat: spigot face = flange plane = elbow_roll z 0.
#   forearm side  the V1 cuff has a D72 pocket from z 3.5 to 12.5 behind a
#                 D68 lip.  The disc lives in that pocket (9.0 mm deep vs an
#                 8.5 mm disc: 0.5 mm axial play).  Hanging load pulls the lip
#                 onto the disc shoulder (part z 1.85), so the forearm face
#                 sits 3.5 - 1.85 = 1.65 mm on the elbow side of the flange
#                 plane: that is mount.xyz's z.  The lip then clears the
#                 stationary housing face (elbow_roll z -2.0) by 0.35 mm.
#   radial pilots land at forearm z 8.0 -- drill the cuff there, at +/-Y.
#
# Check on the real arm (the meshes cannot tell):
#   - no centre bore: the URDF's elbow_roll mesh is a D10 x 10 hub that now
#     sits inside the disc.  If the real output has a hub, the spigot cannot
#     reach the flange.
#   - disc OD 72.0 vs pocket ID 71.82-71.96 in the V1 mesh: zero clearance as
#     drawn; a printed fit needs a few tenths.
#   - in the mesh the pocket is closed at both ends (D68 lip, D58 shoulder).
#
# After assembling the real arm, verify with the tuning model as before:
#
#   python3 generate_urdf.py
#   ros2 launch berkeley_humanoid_lite_description display.launch.py model:=tuning
#   ros2 run berkeley_humanoid_lite_description read_mount.py --watch
#
# Slider values are the URDF origin directly -- paste them back over mount.right.
# =========================================================================
mount:
  right:
    xyz: [0.0, 0.0, -0.00165]
    rpy: [0.0, 0.0, 0.0]
  # `mirror` derives the left mount from the right by negating y and the
  # roll/yaw components. Replace with explicit xyz/rpy if the sides differ.
  left: mirror

  # The printed part between the elbow_roll flange and the V1 forearm cuff.
  # Mesh is authored in mm in the elbow_roll frame; generate_urdf.py hangs it
  # on the arm_*_mount link with the inverse mount transform, so re-tuning the
  # mount moves the forearm, never the printed part.  The part is mirror
  # symmetric across xz, so both sides share one STL.  Mass is the solid-PLA
  # volume (36.0 cm3) at 1240 kg/m3 -- weigh the finished print and correct.
  adapter:
    mesh: package://berkeley_humanoid_lite_description/meshes_adapter/bhl_v1_forearm_coupling_v2.stl
    scale: 0.001
    mass: 0.0447
    com: [0.0, 0.0, 0.005702]         # [m], elbow_roll frame
    inertia: [1.42718e-05, 1.43386e-05, 2.79499e-05, 0.0, 0.0, 0.0]
    # [ixx, iyy, izz, ixy, ixz, iyz] kg m2, about the com, elbow_roll axes

wrist:
  # false welds the hand straight to the mount (the DexHand V2 arrangement).
  enabled: true

  # Which joints to take from the V1 URDF, in order. Dropping a name welds that
  # joint at zero, so ["wrist_pitch_lower", "wrist_yaw"] gives a 2-DOF wrist if
  # you build it with fewer servos.
  joints:
    - wrist_pitch_lower
    - wrist_yaw
    - wrist_pitch_upper

  # Upstream inertials are Fusion 360 defaults at steel density (~7850 kg/m3),
  # which overstates a printed forearm by roughly 6.3x. Masses and inertia
  # tensors are rescaled by this / 7850.
  #
  # 1240 is solid PLA. Real parts are 25-30% infill so the true structure is
  # lighter still -- but the servos, battery and electronics inside the forearm
  # are not modelled at all, and they roughly cancel it. Neither number is
  # measured; weigh the finished assembly if it matters.
  structure_density_kgm3: 1240.0

# Wrist -> DexHand V2 hand base (`base_link`).
#
# V1's own wrist_pitch_upper drives `index_bulk_1`, the first link of the V1
# hand. Here the V2 hand takes that place, so this transform is the V1-wrist to
# V2-hand mechanical interface -- a part that does not exist yet. Identity until
# it is designed.
hand_interface:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# ======================= Which DexHand this build is =======================
# The vendored description is the full V2 hand: 16 independently actuated
# joints plus 5 that mimic. This build is the 8-servo variant, and until now
# that variant was a URDF sitting on one developer's laptop
# (dexhand_moveit_ws/.../dexhandv2_right_8servo.urdf), which meant regenerating
# on any other machine silently produced a different robot. It is described
# here instead so the generated URDFs are reproducible from a fresh clone.
#
# Three kinds of joint:
#
#   actuated  a servo drives it
#   coupled   no servo; a linkage ties it to another joint, emitted as <mimic>
#   frozen    no servo and no linkage; welded at the angle given
#
# ---------------------------------------------------------------------------
# THE COUPLING RATIOS ARE NOT MEASURED. They say a finger curls proportionally
# along its length, which is the right *shape* for a linkage-driven finger and
# the wrong precision. Measure them before trusting fingertip positions:
# command each knuckle across its travel with the hand held still, capture the
# fingertip, and fit -- scripts/motion/fit_finger_coupling.py does the fit.
#
# For scale, WIRobotics' ALLEX publishes measured couplings for a comparable
# anthropomorphic finger: DIP follows PIP at 0.656 and the thumb IP follows its
# MCP at 0.732, both least-squares linear fits through the origin of a quartic.
# Ratios near 1 here are placeholders, not agreement with that.
# ---------------------------------------------------------------------------
hand:
  # Which palm the digits are bolted to.
  #
  #   v1  the DexHand V1 palm: four bulk pieces bolted in a row plus a cover
  #       plate, with a digit on each. This build's palm. The third wrist joint
  #       drives it directly, as upstream intends.
  #   v2  the DexHand V2 palm: one printed part carrying all five digits, welded
  #       to the wrist through an interface part that does not exist yet.
  #
  # Only the digits are V2 here -- "DexHand V1 with the fingers swapped for V2"
  # is a V1 forearm, wrist and palm carrying V2 digit assemblies.
  palm: v1

  # The bracket between a V1 bulk and a V2 digit. NOT MEASURED, and identity is
  # a claim: that a V2 digit bolts exactly where V1's did. For the four fingers
  # that is nearly true -- referred to a common frame the mounts agree to within
  # 2 to 3 mm -- but V2 moved the thumb, and referred the same way it is 15 mm
  # from where V1 put it. Whichever adapter was printed to carry it belongs
  # here; until then the thumb is 15 mm out of place.
  digit_adapter:
    Thumb: {xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}

  fingers: [Index, Middle, Ring, Pinky]

  # Servo travel, tighter than the upstream description's (which is the
  # mechanism's range, not the 8-servo build's): pitch 0.95 vs 1.309 rad,
  # yaw 0.30 vs 0.349.
  actuated:
    Pitch: {lower: 0.0, upper: 0.95}
    Yaw: {lower: -0.30, upper: 0.30}

  # The curl. Driving the knuckle carries the middle phalanx with it, and that
  # carries the tip. Without these the fingers are rigid 75 mm links and no
  # amount of retargeting can make them close.
  #
  # Upstream already declares DIP <- Flexor, but its <mimic> names the driver
  # `Index_Flexor` where the joint is `R_Index_Flexor`, so every one of those
  # tags refers to a joint that does not exist. Re-emitted here with the names
  # the model actually uses.
  coupled:
    Flexor: {driver: Pitch, multiplier: 1.0}
    DIP: {driver: Flexor, multiplier: 1.0}

  # No servo reaches the thumb, so its posture is decided when the hand is
  # assembled and the URDF should say which posture that is. Joint zero is the
  # fully extended, splayed pose: it puts the thumb tip 85 mm from the nearest
  # point any fingertip can reach, so nothing the hand does can oppose it.
  #
  # scripts/motion/analyze_hand.py searches for the posture that closes that gap
  # as far as the mechanism allows. Set these to the angles the thumb is
  # actually built at -- the generator welds the joint with the rotation baked
  # into its origin, so a non-zero angle here moves the thumb.
  # Fingertip frames. The hand description has no frame at the working point of
  # a finger -- `Index_Tip_1` is the tip *link*, whose origin is at its base --
  # so retargeting and IK have nothing to aim at. These add one per finger at
  # the pad. Offset is in the tip link's frame, measured from the mesh.
  #
  # These also used to arrive from the off-repo 8-servo URDF, which is why a
  # regeneration elsewhere produced a hand nothing could target.
  tip_frames:
    offset: [-0.0011, -0.00309, 0.0179]
    parents:
      Index: Index_Tip_1
      Middle: Midle_Tip_1        # upstream's spelling, not a typo here
      Ring: Ring_Tip_1
      Pinky: Pinky_Tip_1

  thumb:
    R_Thumb_Yaw: 0.0
    R_Thumb_Roll: 0.0
    R_Thumb_Pitch: 0.0
    R_Thumb_Flexor: 0.0
    R_Thumb_DIP: 0.0
