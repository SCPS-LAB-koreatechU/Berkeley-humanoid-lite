/**:
  ros__parameters:
    serial_number: -1            # -1 = first ZED found
    frame_id: zed_imu_link
    publish_aux: true            # magnetometer / pressure / temperature / humidity
    reliable_qos: true           # false = best effort (SensorData style)
    gyro_bias_calib_sec: 0.0     # >0: average gyro for N s at startup (camera must be still)
